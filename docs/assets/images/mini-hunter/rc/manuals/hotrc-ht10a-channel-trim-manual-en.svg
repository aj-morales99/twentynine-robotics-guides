<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="500" viewBox="0 0 1400 500" role="img" aria-labelledby="t d">
  <title id="t">HT-10A Channel Trim screen in English</title><desc id="d">English recreation of the official channel trim screen, highlighting CH3 and CH1.</desc>
  <style>.txt{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#172033}.h{font-size:34px;font-weight:800}.sh{font-size:25px;font-weight:800}.b{font-size:21px;font-weight:650}.s{font-size:17px}.muted{fill:#52647c}.white{fill:#fff}.ui{fill:#07111f;stroke:#334155;stroke-width:3}.blue{fill:#41b6e6}.hot{fill:#f97316}</style>
  <rect width="1400" height="500" fill="#f8fafc"/><rect width="1400" height="68" fill="#e5e7eb"/><text x="38" y="46" class="txt h">HT-10A - Channel Trim</text>
  <rect x="45" y="105" width="500" height="330" rx="18" class="ui"/><rect x="75" y="128" width="440" height="48" class="blue"/><text x="295" y="161" text-anchor="middle" class="white sh">Channel Trim</text>
  <g font-family="Consolas,monospace" font-size="20" font-weight="700"><rect x="85" y="205" width="180" height="42" rx="6" class="hot"/><text x="100" y="233" class="white">CH1    +0</text><rect x="290" y="205" width="180" height="42" rx="6" class="blue"/><text x="305" y="233" class="white">CH6    +0</text><rect x="85" y="260" width="180" height="42" rx="6" class="blue"/><text x="100" y="288" class="white">CH2    +0</text><rect x="290" y="260" width="180" height="42" rx="6" class="blue"/><text x="305" y="288" class="white">CH7    +0</text><rect x="85" y="315" width="180" height="42" rx="6" class="hot"/><text x="100" y="343" class="white">CH3    +0</text><rect x="290" y="315" width="180" height="42" rx="6" class="blue"/><text x="305" y="343" class="white">CH8    +0</text></g>
  <text x="600" y="140" class="txt sh">For Mini Hunter</text><text x="600" y="190" class="txt b">CH3 adjusts forward/reverse center.</text><text x="600" y="230" class="txt b">CH1 adjusts turning center.</text>
  <rect x="600" y="270" width="730" height="115" rx="14" fill="#e8f1ff" stroke="#60a5fa" stroke-width="2"/><text x="630" y="310" class="txt b">The trim value starts at +0.</text><text x="630" y="345" class="txt s">Use + to add from the 1500 center or - to subtract from it.</text><text x="630" y="372" class="txt s">Make one small change, then recheck the home-screen value.</text>
  <text x="1360" y="480" text-anchor="end" class="txt s muted">English recreation of the official HotRC manual</text>
</svg>
