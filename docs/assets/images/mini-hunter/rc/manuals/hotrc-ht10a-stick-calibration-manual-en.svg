<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520" role="img" aria-labelledby="t d">
  <title id="t">HT-10A Stick Calibration in English</title><desc id="d">English recreation of the official stick calibration screen and instructions.</desc>
  <style>.txt{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#172033}.h{font-size:34px;font-weight:800}.sh{font-size:25px;font-weight:800}.b{font-size:21px;font-weight:650}.s{font-size:17px}.muted{fill:#52647c}.white{fill:#fff}.ui{fill:#07111f;stroke:#334155;stroke-width:3}.blue{fill:#41b6e6}.arrow{fill:#f97316}</style>
  <rect width="1400" height="520" fill="#f8fafc"/><rect width="1400" height="68" fill="#e5e7eb"/><text x="38" y="46" class="txt h">HT-10A - Stick Calibration</text>
  <rect x="45" y="105" width="500" height="330" rx="18" class="ui"/><rect x="75" y="128" width="440" height="48" class="blue"/><text x="295" y="161" text-anchor="middle" class="white sh">Stick Calibration</text>
  <g transform="translate(160 265)"><circle r="70" fill="#132238" stroke="#94a3b8" stroke-width="4"/><path d="M0-88l-12 20h24zM0 88l-12-20h24zM-88 0l20-12v24zM88 0l-20-12v24z" class="arrow"/><rect x="-13" y="-55" width="26" height="110" fill="#41b6e6"/><rect x="-55" y="-13" width="110" height="26" fill="#41b6e6"/></g>
  <g transform="translate(385 265)"><circle r="70" fill="#132238" stroke="#94a3b8" stroke-width="4"/><path d="M0-88l-12 20h24zM0 88l-12-20h24zM-88 0l20-12v24zM88 0l-20-12v24z" class="arrow"/><rect x="-13" y="-55" width="26" height="110" fill="#41b6e6"/><rect x="-55" y="-13" width="110" height="26" fill="#41b6e6"/></g>
  <rect x="145" y="365" width="300" height="48" rx="8" class="blue"/><text x="295" y="397" text-anchor="middle" class="white b">Confirm calibration</text>
  <text x="600" y="133" class="txt sh">Use only when the stick center has drifted</text>
  <circle cx="625" cy="194" r="21" fill="#2563eb"/><text x="625" y="202" text-anchor="middle" class="white b">1</text><text x="665" y="202" class="txt b">Choose Confirm calibration.</text>
  <circle cx="625" cy="260" r="21" fill="#2563eb"/><text x="625" y="268" text-anchor="middle" class="white b">2</text><text x="665" y="254" class="txt b">Move both sticks in the prompted directions.</text><text x="665" y="282" class="txt s muted">Follow every direction shown on the transmitter.</text>
  <circle cx="625" cy="340" r="21" fill="#2563eb"/><text x="625" y="348" text-anchor="middle" class="white b">3</text><text x="665" y="334" class="txt b">Release both sticks back to center.</text><text x="665" y="362" class="txt s muted">Do not hold either stick while saving the center.</text>
  <circle cx="625" cy="415" r="21" fill="#2563eb"/><text x="625" y="423" text-anchor="middle" class="white b">4</text><text x="665" y="423" class="txt b">Confirm to finish.</text>
  <text x="1360" y="500" text-anchor="end" class="txt s muted">English recreation of the official HotRC manual</text>
</svg>
