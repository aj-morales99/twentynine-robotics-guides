<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650" role="img" aria-labelledby="t d">
  <title id="t">HT-10A centered channel values</title><desc id="d">English diagram of the HT-10A home screen showing CH3 and CH1 centered at 1500.</desc>
  <style>.txt{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#172033}.h{font-size:34px;font-weight:800}.sh{font-size:25px;font-weight:800}.b{font-size:21px;font-weight:650}.s{font-size:17px}.muted{fill:#52647c}.white{fill:#fff}.ui{fill:#07111f;stroke:#334155;stroke-width:3}.blue{fill:#41b6e6}.line{stroke:#ef4444;stroke-width:3}</style>
  <rect width="1400" height="650" fill="#f8fafc"/><rect width="1400" height="68" fill="#e5e7eb"/><text x="38" y="46" class="txt h">HT-10A - Centered Channel Values</text>
  <rect x="370" y="105" width="660" height="440" rx="18" class="ui"/>
  <text x="395" y="145" class="white b">M-1</text><text x="510" y="145" class="white s">MODEL</text><text x="910" y="145" class="white s">SIGNAL 100%</text>
  <rect x="400" y="170" width="285" height="95" rx="8" class="blue"/><rect x="715" y="170" width="285" height="95" rx="8" class="blue"/>
  <text x="542" y="207" text-anchor="middle" class="white sh">Left stick</text><text x="542" y="242" text-anchor="middle" class="white b">centered</text><text x="857" y="207" text-anchor="middle" class="white sh">Right stick</text><text x="857" y="242" text-anchor="middle" class="white b">centered</text>
  <g font-family="Consolas,monospace" font-size="27" font-weight="700"><rect x="400" y="300" width="285" height="64" rx="6" class="blue"/><text x="420" y="341" class="white">CH3</text><text x="650" y="341" text-anchor="end" class="white">1500</text><rect x="715" y="300" width="285" height="64" rx="6" class="blue"/><text x="735" y="341" class="white">CH1</text><text x="965" y="341" text-anchor="end" class="white">1500</text><rect x="400" y="382" width="285" height="64" rx="6" class="blue"/><text x="420" y="423" class="white">CH4</text><text x="650" y="423" text-anchor="end" class="white">1500</text><rect x="715" y="382" width="285" height="64" rx="6" class="blue"/><text x="735" y="423" class="white">CH2</text><text x="965" y="423" text-anchor="end" class="white">1500</text></g>
  <path d="M400 332H235" class="line"/><circle cx="400" cy="332" r="7" fill="#ef4444"/><text x="45" y="318" class="txt sh">CH3 = 1500</text><text x="45" y="349" class="txt s muted">Forward/reverse center</text>
  <path d="M1000 332H1165" class="line"/><circle cx="1000" cy="332" r="7" fill="#ef4444"/><text x="1185" y="318" class="txt sh">CH1 = 1500</text><text x="1185" y="349" class="txt s muted">Turning center</text>
  <rect x="275" y="565" width="850" height="52" rx="12" fill="#e8f1ff" stroke="#60a5fa" stroke-width="2"/><text x="700" y="598" text-anchor="middle" class="txt b">Release both sticks before reading the channel values.</text>
  <text x="1360" y="632" text-anchor="end" class="txt s muted">English recreation of the official HotRC manual</text>
</svg>
