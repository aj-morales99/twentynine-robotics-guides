<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520" role="img" aria-labelledby="t d">
  <title id="t">HT-10A pairing setup in English</title><desc id="d">English recreation of the official manual pairing screen and receiver binding steps.</desc>
  <style>.txt{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#172033}.h{font-size:34px;font-weight:800}.sh{font-size:25px;font-weight:800}.b{font-size:21px;font-weight:650}.s{font-size:17px}.muted{fill:#52647c}.ui{fill:#07111f;stroke:#64748b;stroke-width:3}.blue{fill:#35a9e0}.orange{fill:#f26522}.white{fill:#fff}.line{stroke:#cbd5e1;stroke-width:2}</style>
  <rect width="1400" height="520" fill="#f8fafc"/><rect width="1400" height="68" fill="#e5e7eb"/>
  <text x="38" y="46" class="txt h">HT-10A - Pairing Settings</text>
  <rect x="40" y="100" width="410" height="330" rx="18" class="ui"/>
  <rect x="70" y="125" width="350" height="48" class="blue"/><text x="245" y="158" text-anchor="middle" class="white sh" font-family="Arial">Pairing Settings</text>
  <rect x="80" y="210" width="165" height="58" rx="8" class="blue"/><text x="162" y="247" text-anchor="middle" class="white b" font-family="Arial">Start pairing</text>
  <rect x="270" y="210" width="120" height="58" rx="8" class="orange"/><text x="330" y="247" text-anchor="middle" class="white b" font-family="Arial">Start</text>
  <rect x="80" y="294" width="165" height="58" rx="8" class="blue"/><text x="162" y="331" text-anchor="middle" class="white b" font-family="Arial">RF signal</text>
  <text x="285" y="318" class="white s" font-family="Arial">Enabled</text><rect x="330" y="330" width="52" height="24" rx="12" fill="#35a9e0"/><circle cx="370" cy="342" r="9" fill="#fff"/>
  <text x="495" y="123" class="txt sh">Official pairing sequence</text>
  <line x1="495" y1="143" x2="1340" y2="143" class="line"/>
  <circle cx="525" cy="194" r="22" fill="#2563eb"/><text x="525" y="202" text-anchor="middle" class="white b">1</text><text x="570" y="201" class="txt b">Power the F-10A receiver.</text>
  <circle cx="525" cy="260" r="22" fill="#2563eb"/><text x="525" y="268" text-anchor="middle" class="white b">2</text><text x="570" y="254" class="txt b">Press the receiver BIND button once.</text><text x="570" y="282" class="txt s muted">The green LED changes from slow flash to fast flash.</text>
  <circle cx="525" cy="342" r="22" fill="#2563eb"/><text x="525" y="350" text-anchor="middle" class="white b">3</text><text x="570" y="336" class="txt b">On the HT-10A, choose Start pairing, then Start.</text><text x="570" y="364" class="txt s muted">A steady green receiver LED means pairing is complete.</text>
  <rect x="495" y="405" width="845" height="68" rx="14" fill="#e8f1ff" stroke="#60a5fa" stroke-width="2"/><text x="525" y="435" class="txt b">LED checkpoint:</text><text x="690" y="435" class="txt s">slow flash = no signal · fast flash = pairing</text><text x="690" y="460" class="txt s">steady green = connected</text>
  <text x="1360" y="502" text-anchor="end" class="txt s muted">English recreation of the official HotRC manual</text>
</svg>
