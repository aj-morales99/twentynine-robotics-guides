<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="500" viewBox="0 0 1400 500" role="img" aria-labelledby="t d">
  <title id="t">CT-6A binding procedure in English</title><desc id="d">English recreation of the official CT-6A three-step binding procedure and LED states.</desc>
  <style>.txt{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#172033}.h{font-size:34px;font-weight:800}.sh{font-size:24px;font-weight:800}.b{font-size:20px;font-weight:650}.s{font-size:17px}.muted{fill:#52647c}.white{fill:#fff}</style>
  <rect width="1400" height="500" fill="#f8fafc"/><rect width="1400" height="68" fill="#e5e7eb"/><text x="38" y="46" class="txt h">CT-6A - Binding Procedure</text>
  <g transform="translate(55 115)"><rect width="380" height="230" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><circle cx="55" cy="55" r="25" fill="#2563eb"/><text x="55" y="63" text-anchor="middle" class="white b">1</text><text x="95" y="62" class="txt sh">Power receiver</text><circle cx="80" cy="137" r="15" fill="#64748b"/><text x="112" y="143" class="txt b">Green LED:</text><text x="112" y="174" class="txt b">slow flash</text><text x="35" y="210" class="txt s muted">Receiver has no transmitter signal.</text></g>
  <path d="M455 230H510" stroke="#94a3b8" stroke-width="8"/><path d="M510 230l-22-16v32z" fill="#94a3b8"/>
  <g transform="translate(515 115)"><rect width="380" height="230" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><circle cx="55" cy="55" r="25" fill="#2563eb"/><text x="55" y="63" text-anchor="middle" class="white b">2</text><text x="95" y="62" class="txt sh">Press BIND once</text><rect x="45" y="110" width="92" height="50" rx="12" fill="#1f2937"/><text x="91" y="142" text-anchor="middle" class="white b">BIND</text><circle cx="180" cy="137" r="15" fill="#60a5fa"/><text x="212" y="143" class="txt b">Fast flash</text><text x="35" y="210" class="txt s muted">Receiver is now pairing.</text></g>
  <path d="M915 230H970" stroke="#94a3b8" stroke-width="8"/><path d="M970 230l-22-16v32z" fill="#94a3b8"/>
  <g transform="translate(975 115)"><rect width="370" height="230" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="3"/><circle cx="55" cy="55" r="25" fill="#2563eb"/><text x="55" y="63" text-anchor="middle" class="white b">3</text><text x="95" y="62" class="txt sh">Power CT-6A</text><circle cx="80" cy="137" r="15" fill="#22c55e"/><text x="112" y="143" class="txt b">Steady green</text><text x="35" y="190" class="txt s muted">Transmitter and receiver</text><text x="35" y="214" class="txt s muted">are connected.</text></g>
  <rect x="290" y="386" width="820" height="65" rx="14" fill="#e8f1ff" stroke="#60a5fa" stroke-width="2"/><text x="700" y="427" text-anchor="middle" class="txt b">Do not continue while the receiver LED is still flashing.</text>
  <text x="1360" y="482" text-anchor="end" class="txt s muted">English recreation of the official HotRC manual</text>
</svg>
