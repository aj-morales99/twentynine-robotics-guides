<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="title desc">
  <title id="title">Three-system enemy sensor directions</title>
  <desc id="desc">A simple box represents the robot, with arrows pointing front-left, front, and front-right.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#38d7f2"/></marker></defs>
  <rect width="960" height="500" rx="24" fill="#101827"/>
  <text x="48" y="58" fill="#f8fafc" font-family="Roboto,Arial,sans-serif" font-size="30" font-weight="700">3-system sensor directions</text>
  <rect x="350" y="245" width="260" height="180" rx="18" fill="#246bdb" stroke="#8fc5ff" stroke-width="4"/>
  <path d="M480 260 454 300h52Z" fill="#fff"/>
  <g fill="none" stroke="#38d7f2" stroke-width="8" marker-end="url(#arrow)">
    <path d="M400 255 Q315 190 250 115"/>
    <path d="M480 245 V95"/>
    <path d="M560 255 Q645 190 710 115"/>
  </g>
  <g fill="#f8fafc" font-family="Roboto,Arial,sans-serif" font-size="23" font-weight="700">
    <text x="155" y="105">FRONT LEFT</text>
    <text x="480" y="82" text-anchor="middle">FRONT</text>
    <text x="805" y="105" text-anchor="end">FRONT RIGHT</text>
  </g>
  <text x="480" y="465" text-anchor="middle" fill="#93a4bb" font-family="Roboto,Arial,sans-serif" font-size="20">The box shows orientation only; it is not the robot's physical shape.</text>
</svg>
