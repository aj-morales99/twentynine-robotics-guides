<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" role="img" aria-labelledby="title desc">
  <title id="title">Five-system enemy detection OLED example</title>
  <desc id="desc">OLED example showing three front distance values on the first value line and left and right distances below.</desc>
  <rect width="960" height="390" rx="24" fill="#101827"/>
  <text x="48" y="58" fill="#f8fafc" font-family="Roboto,Arial,sans-serif" font-size="30" font-weight="700">5-system OLED example</text>
  <g transform="translate(105 88)">
    <rect width="750" height="236" rx="18" fill="#0b2f62" stroke="#4ea5ff" stroke-width="5"/>
    <rect x="38" y="26" width="590" height="184" rx="6" fill="#02060d" stroke="#7894b9" stroke-width="3"/>
    <text x="333" y="70" text-anchor="middle" fill="#fff" font-family="monospace" font-size="24">ENEMY DETECTION CHECK</text>
    <text x="333" y="123" text-anchor="middle" fill="#fff" font-family="monospace" font-size="31">35cm 20cm 42cm</text>
    <text x="333" y="174" text-anchor="middle" fill="#fff" font-family="monospace" font-size="31">55cm       60cm</text>
    <g fill="#cbd5e1"><circle cx="690" cy="53" r="11"/><circle cx="690" cy="97" r="11"/><circle cx="690" cy="141" r="11"/><circle cx="690" cy="185" r="11"/></g>
  </g>
  <g fill="#38d7f2" font-family="Roboto,Arial,sans-serif" font-size="17" font-weight="700"><text x="310" y="350" text-anchor="middle">FRONT LEFT · FRONT · FRONT RIGHT</text><text x="650" y="350" text-anchor="middle">LEFT · RIGHT</text></g>
</svg>
